[workspace]
members = [
    "crates/domain-model",
    "crates/contracts",
    "crates/platform-api",
    "crates/auth-scope",
    "crates/workflow-engine",
    "crates/workflow-definitions",
    "crates/prompt-registry",
    "crates/tool-registry",
    "crates/mcp-gateway",
    "crates/llm-gateway",
    "crates/document-vlm-runtime",
    "crates/external-action-worker",
    "crates/external-source-worker",
    "crates/ingest-worker",
    "crates/media-worker",
    "crates/retrieval-worker",
    "crates/memory-worker",
    "crates/dataset-output-worker",
    "crates/chat-session-worker",
    "crates/codex-host-agent",
    "crates/report-planner-worker",
    "crates/report-render-worker",
    "crates/report-runtime",
    "crates/report-compiler",
    "crates/report-publisher",
    "crates/assistant-runtime",
    "crates/static-page-runtime",
    "crates/static-page-renderer",
    "crates/static-page-worker",
    "crates/storage",
    "crates/analytics",
    "crates/event-bus",
    "crates/observability",
    "crates/test-fixtures",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AI Data Platform Team"]

[workspace.dependencies]
aes = "0.8.4"
async-nats = "0.47.0"
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["json", "macros"] }
base64 = "0.22.1"
cbc = "0.1.2"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
futures-util = "0.3.31"
hmac = "0.12.1"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
quick-xml = "0.38.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
