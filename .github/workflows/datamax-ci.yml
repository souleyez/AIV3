name: DataMax CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datamax-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-credential-smoke:
    name: No-Credential Smoke
    if: >-
      ${{
        vars.DATAMAX_CI_USE_ISOLATED_WINDOWS != 'true' ||
        github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.sha == vars.DATAMAX_CI_TRUSTED_SHA)
      }}
    runs-on: ${{ fromJSON(vars.DATAMAX_CI_USE_ISOLATED_WINDOWS == 'true' && '["self-hosted","Windows","X64","aiv3-ci-isolated"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prefer Git for Windows bash on an isolated Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\Program Files\Git\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\Git\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install verified Node.js on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node_version=22.22.1
          archive="node-v${node_version}-linux-x64.tar.xz"
          base_url="https://nodejs.org/dist/v${node_version}"
          curl --fail --location --silent --show-error "${base_url}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error "${base_url}/SHASUMS256.txt" \
            --output "${RUNNER_TEMP}/SHASUMS256.txt"
          grep -E "  ${archive}$" "${RUNNER_TEMP}/SHASUMS256.txt" \
            | (cd "${RUNNER_TEMP}" && sha256sum --check --strict -)
          mkdir -p "${RUNNER_TEMP}/node-${node_version}"
          tar -xJf "${RUNNER_TEMP}/${archive}" \
            --strip-components=1 -C "${RUNNER_TEMP}/node-${node_version}"
          echo "${RUNNER_TEMP}/node-${node_version}/bin" >> "${GITHUB_PATH}"

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      - name: Check Node toolchain
        run: |
          node -e "if (process.version !== 'v22.22.1') process.exit(1)"
          node -v
          npm -v
          pnpm -v

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard sensitive connection log fields
        run: node tools/check-sensitive-log-fields.mjs

      - name: Check smoke script syntax
        run: |
          node --check scripts/smoke/main-chat-20way.mjs
          node --check scripts/smoke/external-channel-20way.mjs
          node --check scripts/smoke/static-page-5way.mjs
          node --check scripts/smoke/static-page-prewarm-observability.mjs
          node --check scripts/smoke/cloudflare-fallback-2way.mjs
          node --check scripts/smoke/p2-summary-only-dry-run.mjs
          node --check scripts/smoke/document-fingerprint-inventory.mjs
          node --check scripts/smoke/document-object-cleanup-plan.mjs
          node --check scripts/smoke/document-object-filesystem-preflight.mjs
          node --check scripts/smoke/document-object-repair-plan.mjs
          node --check scripts/smoke/fashion-design-asset-import.mjs

      - name: Run deterministic smoke self-tests
        run: |
          npm run smoke:external-report-focus -- --self-test
          npm run smoke:external-report-export -- --self-test
          npm run smoke:external-scoped-document-chat -- --self-test
          npm run smoke:external-video-ppt -- --self-test
          npm run smoke:main-chat-20way -- --self-test
          npm run smoke:external-channel-20way -- --self-test
          npm run smoke:static-page-5way -- --self-test
          npm run smoke:static-page-prewarm-observability -- --self-test
          npm run smoke:cloudflare-fallback-2way -- --self-test
          npm run smoke:p2-summary-only-dry-run -- --self-test
          npm run smoke:document-fingerprint-inventory -- --self-test
          npm run smoke:document-object-cleanup-plan -- --self-test
          npm run smoke:document-object-filesystem-preflight -- --self-test
          npm run smoke:document-object-repair-plan -- --self-test
          npm run smoke:production-placeholder-readiness -- --self-test --allow-not-ready --json-stdout
          npm run smoke:newbai-customer-answer-live-capture -- --self-test

      - name: Guard asset and public integration contracts
        run: |
          npm run test:third-party-public-contract-guard
          npm run smoke:fashion-design-asset-import -- --self-test --pretty
          npm run smoke:fashion-design-asset-import -- --preflight --pretty

      - name: Run dataset semantic understanding no-credential smoke
        run: bash scripts/run-dataset-semantic-understanding-smoke.sh --no-credentials

      - name: Check generated public integration guide
        run: npm run check:pure-third-party-guide-html

  rust-minimal:
    name: Rust P0
    if: >-
      ${{
        vars.DATAMAX_CI_USE_ISOLATED_WINDOWS != 'true' ||
        github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.sha == vars.DATAMAX_CI_TRUSTED_SHA)
      }}
    runs-on: ${{ fromJSON(vars.DATAMAX_CI_USE_ISOLATED_WINDOWS == 'true' && '["self-hosted","Windows","X64","aiv3-ci-isolated"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prefer Git for Windows bash on an isolated Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\Program Files\Git\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\Git\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libsqlite3-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: datamax-rust-1.95.0-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            datamax-rust-1.95.0-${{ runner.os }}-

      - name: Check Rust and native toolchain
        shell: bash
        run: |
          cargo --version
          rustc --version
          rustfmt --version
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            command -v clang
            command -v clang++
          fi

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust workspace check
        run: cargo check --workspace --locked

      - name: Connection redaction gates
        run: cargo test --locked -p observability -p event-bus -p test-fixtures

      - name: Current P0 filtered tests
        shell: bash
        run: |
          run_filtered_test() {
            local name="$1"
            shift
            local output
            output="$(mktemp)"
            echo "== ${name} =="
            set +e
            "$@" 2>&1 | tee "${output}"
            local command_status=${PIPESTATUS[0]}
            set -e
            if (( command_status != 0 )); then
              rm -f "${output}"
              return "${command_status}"
            fi
            if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "${output}"; then
              echo "filtered test gate executed zero tests: ${name}" >&2
              rm -f "${output}"
              return 1
            fi
            rm -f "${output}"
          }

          run_filtered_test "external channel action prompt" \
            cargo test --locked -p platform-api external_channel_action_prompt_support::tests --lib
          run_filtered_test "database field support" \
            cargo test --locked -p platform-api database_field_support --lib
          run_filtered_test "database prompt support" \
            cargo test --locked -p platform-api database_prompt_support --lib
          run_filtered_test "aggregate query" \
            cargo test --locked -p external-source-connectors aggregate_query --lib

      - name: Assistant answer contract smokes
        run: |
          bash scripts/run-assistant-chat-contract-smoke.sh
          bash scripts/run-external-direct-reply-smoke.sh

      - name: Guard asset import modules
        run: |
          cargo test --locked -p platform-api asset_import --lib
          cargo test --locked -p platform-api fashion_postchain_adapter --lib

      - name: Dataset semantic understanding gates
        run: |
          cargo test --locked -p storage dataset_semantic --lib
          cargo test --locked -p platform-api semantic_understanding --lib
          cargo test --locked -p platform-api dataset_semantic --lib
          cargo test --locked -p retrieval-worker semantic_profile

      - name: Model gateway tests
        run: |
          cargo test --locked -p platform-api gateway_limiter --lib
          cargo test --locked -p platform-api model_gateway_profile --lib
          cargo test --locked -p platform-api gateway_status_exposes_lane_and_provider_counts_without_secrets --lib

      - name: Static page worker tests
        run: cargo test --locked -p static-page-worker --lib

  web:
    name: Web
    if: >-
      ${{
        vars.DATAMAX_CI_USE_ISOLATED_WINDOWS != 'true' ||
        github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.sha == vars.DATAMAX_CI_TRUSTED_SHA)
      }}
    runs-on: ${{ fromJSON(vars.DATAMAX_CI_USE_ISOLATED_WINDOWS == 'true' && '["self-hosted","Windows","X64","aiv3-ci-isolated"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install verified Node.js on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node_version=22.22.1
          archive="node-v${node_version}-linux-x64.tar.xz"
          base_url="https://nodejs.org/dist/v${node_version}"
          curl --fail --location --silent --show-error "${base_url}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error "${base_url}/SHASUMS256.txt" \
            --output "${RUNNER_TEMP}/SHASUMS256.txt"
          grep -E "  ${archive}$" "${RUNNER_TEMP}/SHASUMS256.txt" \
            | (cd "${RUNNER_TEMP}" && sha256sum --check --strict -)
          mkdir -p "${RUNNER_TEMP}/node-${node_version}"
          tar -xJf "${RUNNER_TEMP}/${archive}" \
            --strip-components=1 -C "${RUNNER_TEMP}/node-${node_version}"
          echo "${RUNNER_TEMP}/node-${node_version}/bin" >> "${GITHUB_PATH}"

      - name: Install pnpm
        run: npm install --global pnpm@10.33.2

      - name: Check Node toolchain
        run: |
          node -e "if (process.version !== 'v22.22.1') process.exit(1)"
          node -v
          npm -v
          pnpm -v

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: npm run test:web

      - name: Build web app
        run: npm --prefix apps/web run build
