services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_platform
      POSTGRES_PASSWORD: ai_platform
      POSTGRES_DB: ai_data_platform_v3
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ai-platform
      MINIO_ROOT_PASSWORD: ai-platform-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
  nats-data:
